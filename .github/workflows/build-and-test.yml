name: build and test Package Explorer

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Restore solution
        run: dotnet restore Dotnet.PackageExplorer.slnx
      - name: Build Debug and Release
        shell: pwsh
        run: |
          dotnet build Dotnet.PackageExplorer.slnx --configuration Debug --no-restore
          dotnet build Dotnet.PackageExplorer.slnx --configuration Release --no-restore
      - name: Run application unit tests
        working-directory: tests/unit/Application/bin/Debug/net10.0
        run: dotnet Dotnet.PackageExplorer.Application.UnitTests.dll --fail-skips on
      - name: Run RPC client unit tests
        working-directory: tests/unit/RpcClient/bin/Debug/net10.0
        run: dotnet Dotnet.PackageExplorer.RpcClient.UnitTests.dll --fail-skips on
      - name: Run terminal unit tests
        working-directory: tests/unit/Terminal/bin/Debug/net10.0
        run: dotnet Dotnet.PackageExplorer.Terminal.UnitTests.dll --fail-skips on
      - name: Run RPC client integration tests
        working-directory: tests/integration/RpcClient/bin/Debug/net10.0
        run: dotnet Dotnet.PackageExplorer.RpcClient.IntegrationTests.dll --fail-skips on
      - name: Run terminal integration tests
        shell: bash
        working-directory: tests/integration/Terminal/bin/Debug/net10.0
        run: dotnet Dotnet.PackageExplorer.Terminal.IntegrationTests.dll --fail-skips on
